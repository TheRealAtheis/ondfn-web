<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ond</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="icon.png">
</head>
<body>
  <!-- Intro overlay -->
  <div id="intro" class="intro">
    <p>Click to view</p>
  </div>

  <div class="background"></div>

  <main class="card hidden">
    <img src="icon.png" alt="Profile" class="avatar">
    
    <h1 class="name">ond</h1>
    <p class="bio">100+ Vouches || discord.gg/ondfn</p>

    <div class="payments">
      <button class="pay-btn" data-copy="https://paypal.me/sylarcr" title="Copy PayPal">
        <img src="payments/paypal.png" alt="PayPal">
      </button>
      <button class="pay-btn" data-copy="bc1quqxx39j97xcjwa7rzc0dcmvx9gsxl0mlvvkdy8" title="Copy Bitcoin">
        <img src="payments/btc.png" alt="Bitcoin">
      </button>
      <button class="pay-btn" data-copy="Lgtexwa8eWSGwn2g2WANVyJpXsbZ1b3Por" title="Copy Litecoin">
        <img src="payments/ltc.png" alt="Litecoin">
      </button>
      <button class="pay-btn" data-copy="6yTggVujkzxiV22j7usEMNRmHSAzfSmDzACNn6kJPDUa" title="Copy Solana">
        <img src="payments/sol.png" alt="Solana">
      </button>
      <button class="pay-btn" data-copy="0xb8787367cB34659E6b64de977938165EAf60980E" title="Copy Ethereum">
        <img src="payments/eth.png" alt="Ethereum">
      </button>
      <button class="pay-btn" data-copy="https://discord.gg/ondfn" title="Copy Discord">
        <img src="payments/discord.png" alt="Discord">
      </button>
    </div>
  </main>

  <!-- Music -->
  <audio id="bg-music" loop preload="auto">
    <source src="music.mp3" type="video/mp4">
  </audio>

  <button id="music-btn" class="music-btn hidden" title="Toggle music">
    🔊
  </button>

  <div id="toast" class="toast hidden">Copied!</div>

  <script src="script.js"></script>
</body>
</html>
