<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Name | Portfolio</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="icon.png">
</head>
<body>
  <div class="background"></div>

  <main class="card">
    <img src="icon.png" alt="Profile" class="avatar">
    
    <h1 class="name">Your Name</h1>
    <p class="bio">Short bio or tagline goes here.</p>

    <div class="payments">
      <button class="pay-btn" data-copy="your-paypal-email@example.com" title="Copy PayPal">
        <img src="payments/paypal.png" alt="PayPal">
      </button>
      <button class="pay-btn" data-copy="your-btc-address" title="Copy Bitcoin">
        <img src="payments/btc.png" alt="Bitcoin">
      </button>
      <button class="pay-btn" data-copy="your-ltc-address" title="Copy Litecoin">
        <img src="payments/ltc.png" alt="Litecoin">
      </button>
      <button class="pay-btn" data-copy="your-sol-address" title="Copy Solana">
        <img src="payments/sol.png" alt="Solana">
      </button>
      <button class="pay-btn" data-copy="your-eth-address" title="Copy Ethereum">
        <img src="payments/eth.png" alt="Ethereum">
      </button>
      <button class="pay-btn" data-copy="your-discord-username" title="Copy Discord">
        <img src="payments/discord.png" alt="Discord">
      </button>
    </div>

    <div id="toast" class="toast hidden">Copied!</div>
  </main>

  <script src="script.js"></script>
</body>
</html>
